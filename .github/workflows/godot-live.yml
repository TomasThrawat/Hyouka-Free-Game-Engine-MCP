name: Godot Live MCP

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/godot-live.yml"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Lease length for this bridge runner"
        required: false
        default: "300"
        type: string
      handoff_after_minutes:
        description: "Minutes before successor handoff"
        required: false
        default: "240"
        type: string

permissions:
  actions: write
  contents: write

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 jq

      - name: Install Godot 4.7.2 .NET
        run: |
          set -e
          curl -fL --retry 8 -o /tmp/godot.zip             https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          curl -fL --retry 8 -o /tmp/SHA512-SUMS.txt             https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          CHECKSUM=$(grep -E '[[:space:]]Godot_v4\.7\.2-stable_mono_linux_x86_64\.zip$' /tmp/SHA512-SUMS.txt | awk '{print $1}')
          test -n "$CHECKSUM"
          printf '%s  /tmp/godot.zip\n' "$CHECKSUM" | sha512sum -c -
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -oq /tmp/godot.zip -d /tmp/godot
          GODOT_DIR=$(find /tmp/godot -maxdepth 1 -type d -name 'Godot_v4.7.2-stable_mono_linux_x86_64' -print -quit)
          test -n "$GODOT_DIR"
          test -d "$GODOT_DIR/GodotSharp/Api/Debug"
          GODOT_BIN=$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_mono_linux*' -print -quit)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate bridge before publish
        run: |
          set -e
          python3 -m py_compile godot/public_bridge.py
          test -f runtime/godot-smoke-test/project.godot
          ! grep -RniE 'O3DE|o3de|Blender|blender/' app godot runtime .devcontainer README.md 2>/dev/null

      - name: Start Godot bridge
        run: |
          set -e
          nohup env             GODOT_BIN="$GODOT_BIN"             GODOT_WORKSPACE_ROOT="$GITHUB_WORKSPACE"             GODOT_BRIDGE_HOST="127.0.0.1"             python3 godot/public_bridge.py >/tmp/godot-bridge.log 2>&1 &
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:9765/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1
          curl -fsS http://127.0.0.1:9765/health
          curl -fsS http://127.0.0.1:9765/selftest

      - name: Install current cloudflared
        run: |
          set -e
          VERSION=2026.9.3
          curl -fsSL "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/$VERSION" -o /tmp/cloudflared-release.json
          URL=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cloudflared-release.json'))
          print(next(x['browser_download_url'] for x in d['assets'] if x['name']=='cloudflared-linux-amd64'))
          PY
          )
          DIGEST=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cloudflared-release.json'))
          print((next(x for x in d['assets'] if x['name']=='cloudflared-linux-amd64').get('digest') or '').split(':',1)[-1])
          PY
          )
          test -n "$DIGEST"
          curl -fL --retry 8 -o /tmp/cloudflared "$URL"
          printf '%s  /tmp/cloudflared\n' "$DIGEST" | sha256sum -c -
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public tunnel
        id: tunnel
        run: |
          set -e
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:9765 >/tmp/cloudflared.log 2>&1 &
          URL=""
          READY=0
          for i in $(seq 1 60); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if test -n "$URL" && curl -fsS "$URL/health" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" -eq 1
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Tunnel is ready"

      - name: Publish live bridge metadata
        env:
          URL: ${{ steps.tunnel.outputs.url }}
          DURATION: ${{ inputs.duration_minutes || '10' }}
        run: |
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            jq -n               --arg url "$URL"               --arg duration "$DURATION"               --arg run "$GITHUB_RUN_ID"               '{status:"ok",engine:"Godot",url:$url,runtime:"Godot 4.7.2-stable .NET Linux x86_64",source:"https://github.com/godotengine/godot",durationMinutes:$duration,ownerRunId:$run}'               > runtime/godot-bridge.json
            git add runtime/godot-bridge.json
            if git diff --cached --quiet; then
              echo "Metadata unchanged."
              exit 0
            fi
            git commit -m "chore: publish live Godot MCP bridge [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
            sleep 2
          done
          exit 1

      - name: Verify public bridge
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -e
          curl -fsS "$URL/health"
          curl -fsS "$URL/discover" | jq '.status, .engine, (.tools | length)'
          curl -fsS "$URL/selftest" | jq '.status, .smokeTest.status'

      - name: Hand off to successor runner
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event_name }}
          INPUT_MINUTES: ${{ inputs.duration_minutes }}
          INPUT_HANDOFF: ${{ inputs.handoff_after_minutes }}
        run: |
          set -e
          if [ "$RUN_EVENT" = "push" ]; then
            HANDOFF_MINUTES=5
            NEXT_MINUTES=300
          else
            case "$INPUT_MINUTES" in
              ''|*[!0-9]*) exit 1 ;;
            esac
            case "$INPUT_HANDOFF" in
              ''|*[!0-9]*) exit 1 ;;
            esac
            test "$INPUT_MINUTES" -ge 2
            test "$INPUT_MINUTES" -le 300
            test "$INPUT_HANDOFF" -ge 1
            test "$INPUT_HANDOFF" -lt "$INPUT_MINUTES"
            NEXT_MINUTES=300
            HANDOFF_MINUTES="$INPUT_HANDOFF"
          fi
          sleep $((HANDOFF_MINUTES*60))
          curl -fsSL -X POST             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${{ github.repository }}/actions/workflows/godot-live.yml/dispatches"             -d "{\"ref\":\"main\",\"inputs\":{\"duration_minutes\":\"$NEXT_MINUTES\",\"handoff_after_minutes\":\"240\"}}"
          echo "Successor workflow dispatched: $NEXT_MINUTES minutes"
