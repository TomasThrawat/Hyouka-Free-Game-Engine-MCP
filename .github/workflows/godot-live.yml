name: Godot Live MCP

concurrency:
  group: godot-live-mcp
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/godot-live.yml"
      - "godot/public_bridge.py"
      - "runtime/godot-official-cli.json"
      - "godot/native_bridge.py"
      - "godot/native_game_view.gd"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Lease length for this bridge runner"
        required: false
        default: "300"
        type: string
      handoff_after_minutes:
        description: "Minutes before successor handoff"
        required: false
        default: "240"
        type: string
      verification_only:
        description: "Run all startup and E2E/public checks, then exit cleanly without successor handoff"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 355

    steps:
      - name: Configure Git defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install runtime dependencies
        run: |
          timeout 300s sudo apt-get update -o Acquire::Retries=3
          timeout 300s sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl unzip python3 jq xvfb weston labwc libdecor-0-0 libdecor-0-plugin-1-cairo

      - name: Install Godot 4.7.2 .NET
        run: |
          set -e
          curl -fL --retry 8 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          curl -fL --retry 8 -o /tmp/SHA512-SUMS.txt https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          CHECKSUM=$(grep -E '[[:space:]]Godot_v4\.7\.2-stable_mono_linux_x86_64\.zip$' /tmp/SHA512-SUMS.txt | awk '{print $1}')
          test -n "$CHECKSUM"
          printf '%s  /tmp/godot.zip\n' "$CHECKSUM" | sha512sum -c -
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -oq /tmp/godot.zip -d /tmp/godot
          GODOT_DIR=$(find /tmp/godot -maxdepth 1 -type d -name 'Godot_v4.7.2-stable_mono_linux_x86_64' -print -quit)
          test -n "$GODOT_DIR"
          test -d "$GODOT_DIR/GodotSharp/Api/Debug"
          GODOT_BIN=$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_mono_linux*' -print -quit)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Validate bridge before publish
        run: |
          set -e
          python3 -m py_compile godot/public_bridge.py godot/native_bridge.py
          test -f runtime/godot-smoke-test/project.godot
          ! grep -RniE 'O3DE|o3de' app godot runtime .devcontainer README.md 2>/dev/null

      - name: Start Godot bridge
        run: |
          set -e
          nohup Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset >/tmp/xvfb.log 2>&1 &
          export DISPLAY=:99
          for i in $(seq 1 15); do
            if test -S /tmp/.X11-unix/X99; then break; fi
            sleep 1
          done
          test -S /tmp/.X11-unix/X99
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/godot-wayland-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/godot-labwc-config"
          mkdir -p "$XDG_CONFIG_HOME/labwc"
          export LABWC_ENV_FILE="$RUNNER_TEMP/godot-labwc-env"
          cat > "$XDG_CONFIG_HOME/labwc/autostart" <<'EOF'
          #!/bin/sh
          printf 'WAYLAND_DISPLAY=%s\n' "$WAYLAND_DISPLAY" > "$LABWC_ENV_FILE"
          printf 'DISPLAY=%s\n' "${DISPLAY:-}" >> "$LABWC_ENV_FILE"
          EOF
          chmod +x "$XDG_CONFIG_HOME/labwc/autostart"
          export WLR_BACKENDS=headless
          export WLR_HEADLESS_OUTPUTS=1
          export WLR_LIBINPUT_NO_DEVICES=1
          export WLR_RENDERER=pixman
          export LIBSEAT_BACKEND=noop
          export XDG_SESSION_TYPE=wayland
          labwc >/tmp/labwc-godot-e2e.log 2>&1 &
          LABWC_PID=$!
          for i in $(seq 1 30); do
            if test -s "$LABWC_ENV_FILE"; then break; fi
            if ! kill -0 "$LABWC_PID" 2>/dev/null; then cat /tmp/labwc-godot-e2e.log; exit 1; fi
            sleep 1
          done
          test -s "$LABWC_ENV_FILE"
          . "$LABWC_ENV_FILE"
          export WAYLAND_DISPLAY
          export DISPLAY
          WAYLAND_SOCKET="$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          for i in $(seq 1 15); do
            if test -S "$WAYLAND_SOCKET"; then break; fi
            if ! kill -0 "$LABWC_PID" 2>/dev/null; then cat /tmp/labwc-godot-e2e.log; exit 1; fi
            sleep 1
          done
          test -S "$WAYLAND_SOCKET"
          nohup env DISPLAY="$DISPLAY" XDG_RUNTIME_DIR="$XDG_RUNTIME_DIR" WAYLAND_DISPLAY="$WAYLAND_DISPLAY" GODOT_BIN="$GODOT_BIN" GODOT_WORKSPACE_ROOT="$GITHUB_WORKSPACE" GODOT_BRIDGE_HOST="127.0.0.1" python3 godot/native_bridge.py >/tmp/godot-bridge.log 2>&1 &
          READY=0
          for i in $(seq 1 45); do
            if curl -fsS --max-time 5 http://127.0.0.1:9765/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1
          curl -fsS --max-time 10 http://127.0.0.1:9765/health
          curl -fsS --max-time 20 http://127.0.0.1:9765/selftest

      - name: Install current cloudflared
        run: |
          set -e
          VERSION=2026.9.3
          curl -fsSL --max-time 20 "https://api.github.com/repos/cloudflare/cloudflared/releases/tags/$VERSION" -o /tmp/cloudflared-release.json
          URL=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cloudflared-release.json'))
          print(next(x['browser_download_url'] for x in d['assets'] if x['name']=='cloudflared-linux-amd64'))
          PY
          )
          DIGEST=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/cloudflared-release.json'))
          print((next(x for x in d['assets'] if x['name']=='cloudflared-linux-amd64').get('digest') or '').split(':',1)[-1])
          PY
          )
          test -n "$DIGEST"
          curl -fL --retry 8 --max-time 60 -o /tmp/cloudflared "$URL"
          printf '%s  /tmp/cloudflared\n' "$DIGEST" | sha256sum -c -
          chmod +x /tmp/cloudflared
          /tmp/cloudflared --version

      - name: Start public tunnel
        id: tunnel
        run: |
          set -e
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:9765 >/tmp/cloudflared.log 2>&1 &
          URL=""
          READY=0
          for i in $(seq 1 60); do
            URL=$(python3 -c 'import re; t=open("/tmp/cloudflared.log", errors="replace").read(); t=re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", t); m=re.search(r"https://[A-Za-z0-9][A-Za-z0-9.-]*\.trycloudflare\.com(?:/\S*)?", t); print(m.group(0) if m else "")')
            if test -n "$URL" && curl -fsS --max-time 10 "$URL/health" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" -eq 1
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Tunnel is ready"

      - name: Publish live bridge metadata
        if: ${{ inputs.verification_only != true }}
        env:
          URL: ${{ steps.tunnel.outputs.url }}
          DURATION: ${{ inputs.duration_minutes || '10' }}
        run: |
          set -e
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            jq -n --arg url "$URL" --arg duration "$DURATION" --arg run "$GITHUB_RUN_ID" '{status:"ok",engine:"Godot",url:$url,runtime:"Godot 4.7.2-stable .NET Linux x86_64",source:"https://github.com/godotengine/godot",durationMinutes:$duration,ownerRunId:$run}' > runtime/godot-bridge.json
            git add runtime/godot-bridge.json
            if git diff --cached --quiet; then
              echo "Metadata unchanged."
              exit 0
            fi
            git commit -m "chore: publish live Godot MCP bridge [skip ci]"
            if git push origin HEAD:main; then
              exit 0
            fi
            git reset --hard origin/main
            sleep 2
          done
          exit 1

      - name: Verify native Godot view and input end to end
        run: |
          set -e
          TEST_ROOT="$GITHUB_WORKSPACE/.godot-native-e2e"
          PID=""
          cleanup() {
            set +e
            if test -n "$PID" && test "$PID" != "null" && [[ "$PID" =~ ^[0-9]+$ ]]; then
              curl -fsS --max-time 10 -X POST http://127.0.0.1:9765/stop -H 'content-type: application/json' -d "$(jq -nc --argjson pid "$PID" '{pid:$pid}')" >/tmp/godot-native-e2e-stop.json 2>/dev/null || true
            fi
            rm -rf "$TEST_ROOT"
          }
          trap cleanup EXIT
          rm -rf "$TEST_ROOT"
          mkdir -p "$TEST_ROOT"

          cat > "$TEST_ROOT/project.godot" <<'EOF'
          [application]
          config/name="Godot MCP Native E2E"
          run/main_scene="res://Main.tscn"
          [display]
          window/size/viewport_width=320
          window/size/viewport_height=200
          [rendering]
          renderer/rendering_method="gl_compatibility"
          renderer/rendering_method.mobile="gl_compatibility"
          EOF

          cat > "$TEST_ROOT/Main.tscn" <<'EOF'
          [gd_scene load_steps=2 format=3]
          [ext_resource type="Script" path="res://main.gd" id="1"]
          [node name="Root" type="Node2D"]
          script = ExtResource("1")
          EOF

          cat > "$TEST_ROOT/main.gd" <<'EOF'
          extends Node2D
          func _ready() -> void:
              var background := ColorRect.new()
              background.position = Vector2.ZERO
              background.size = Vector2(320, 200)
              background.color = Color("#20242a")
              background.mouse_filter = Control.MOUSE_FILTER_IGNORE
              add_child(background)
              var button := Button.new()
              button.name = "NativeTestButton"
              button.text = "CLICK ME"
              button.position = Vector2(110, 80)
              button.size = Vector2(100, 40)
              button.pressed.connect(_on_pressed)
              add_child(button)
          func _on_pressed() -> void:
              var file := FileAccess.open(ProjectSettings.globalize_path("res://clicked.txt"), FileAccess.WRITE)
              if file:
                  file.store_string("clicked")
                  file.close()
          EOF

          export XDG_RUNTIME_DIR="$RUNNER_TEMP/godot-wayland-runtime"
          test -s "$RUNNER_TEMP/godot-labwc-env"
          . "$RUNNER_TEMP/godot-labwc-env"
          export WAYLAND_DISPLAY
          export DISPLAY
          test -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY"
          RUN_JSON=$(jq -nc --arg path "$TEST_ROOT" '{toolId:"godot-run-project",args:["--display-driver","wayland","--path",$path,"--audio-driver","Dummy"],background:true,timeoutSeconds:30}')
          START=$(curl -sS --fail-with-body --max-time 45 -X POST http://127.0.0.1:9765/invoke -H 'content-type: application/json' -d "$RUN_JSON")
          echo "$START"
          test "$(jq -r '.status' <<<"$START")" = "started"
          PID=$(jq -r '.pid' <<<"$START")
          test "$PID" != "null"

          STATUS=""
          for attempt in $(seq 1 10); do
            STATUS=$(curl -sS --fail-with-body --max-time 15 -X POST http://127.0.0.1:9765/invoke -H 'content-type: application/json' -d "$(jq -nc --arg pid "$PID" '{toolId:"godot-game-status",args:[$pid]}')")
            if test "$(jq -r '.status' <<<"$STATUS")" = "ok"; then
              break
            fi
            sleep 1
          done
          echo "$STATUS" | jq '{status,pid,viewportWidth,viewportHeight,message,stdoutTail,stderrTail}'
          test "$(jq -r '.status' <<<"$STATUS")" = "ok"

          VIEW=$(curl -sS --fail-with-body --max-time 45 -X POST http://127.0.0.1:9765/invoke -H 'content-type: application/json' -d "$(jq -nc --arg pid "$PID" '{toolId:"godot-game-view",args:[$pid]}')")
          echo "$VIEW" | jq '{status,pid,width,height,httpStatus,message,contentType:(.content[0].mimeType // null),hasImage:((.content[0].data // "") | length > 0)}'
          test "$(jq -r '.status' <<<"$VIEW")" = "ok"
          test "$(jq -r '.content[0].mimeType' <<<"$VIEW")" = "image/png"
          jq -r '.content[0].data' <<<"$VIEW" | base64 -d > /tmp/godot-native-e2e.png
          python3 - <<'PY'
          from pathlib import Path
          p=Path("/tmp/godot-native-e2e.png")
          b=p.read_bytes()
          assert b.startswith(b"\x89PNG\r\n\x1a\n"), "not a PNG"
          print("PNG bytes:", len(b))
          PY

          INPUT_JSON=$(jq -nc --arg pid "$PID" '{toolId:"godot-game-input",args:[$pid,"{\"type\":\"click\",\"x\":160,\"y\":100}"]}')
          INPUT=$(curl -sS --fail-with-body --max-time 15 -X POST http://127.0.0.1:9765/invoke -H 'content-type: application/json' -d "$INPUT_JSON")
          echo "$INPUT"
          test "$(jq -r '.status' <<<"$INPUT")" = "ok"
          sleep 1
          test -f "$TEST_ROOT/clicked.txt"
          grep -qx "clicked" "$TEST_ROOT/clicked.txt"
          echo "Native E2E completed successfully."

      - name: Verify public bridge
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          set -e
          curl -fsS --max-time 15 "$URL/health"
          curl -fsS --max-time 30 "$URL/discover" | jq '.status, .engine, (.tools | length)'
          curl -fsS --max-time 30 "$URL/selftest" | jq '.status, .nativeControlCheck.status, .smokeTest.status'
          curl -fsS --max-time 15 "$URL/find?q=godot-game-view" | jq '.tools[0].id, .tools[0].kind'
          curl -fsS --max-time 15 "$URL/find?q=godot-game-input" | jq '.tools[0].id, .tools[0].kind'

      - name: Hand off to successor runner
        if: ${{ inputs.verification_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_EVENT: ${{ github.event_name }}
          INPUT_MINUTES: ${{ inputs.duration_minutes }}
          INPUT_HANDOFF: ${{ inputs.handoff_after_minutes }}
        run: |
          set -e
          if [ "$RUN_EVENT" = "push" ]; then
            HANDOFF_MINUTES=240
            NEXT_MINUTES=300
          else
            case "$INPUT_MINUTES" in
              ''|*[!0-9]*) exit 1 ;;
            esac
            case "$INPUT_HANDOFF" in
              ''|*[!0-9]*) exit 1 ;;
            esac
            test "$INPUT_MINUTES" -ge 2
            test "$INPUT_MINUTES" -le 300
            test "$INPUT_HANDOFF" -ge 1
            test "$INPUT_HANDOFF" -lt "$INPUT_MINUTES"
            NEXT_MINUTES=300
            HANDOFF_MINUTES="$INPUT_HANDOFF"
          fi
          sleep $((HANDOFF_MINUTES*60))
          curl -fsSL --max-time 30 -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/workflows/godot-live.yml/dispatches" -d "{\"ref\":\"main\",\"inputs\":{\"duration_minutes\":\"$NEXT_MINUTES\",\"handoff_after_minutes\":\"240\"}}"
          echo "Successor workflow dispatched: $NEXT_MINUTES minutes"
