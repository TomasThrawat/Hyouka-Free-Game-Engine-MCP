name: Godot Live Bridge

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        required: false
        default: "180"
        type: string

concurrency:
  group: godot-live-bridge
  cancel-in-progress: true

jobs:
  bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install Godot 4.7.2 .NET
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 jq
          dotnet --version
          curl -fL --retry 8 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          curl -fL --retry 8 -o /tmp/SHA512-SUMS.txt https://github.com/godotengine/godot/releases/download/4.7.2-stable/SHA512-SUMS.txt
          CHECKSUM=$(grep -E '[[:space:]]Godot_v4\.7\.2-stable_mono_linux_x86_64\.zip$' /tmp/SHA512-SUMS.txt | awk '{print $1}')
          test -n "$CHECKSUM"
          printf '%s  /tmp/godot.zip
' "$CHECKSUM" | sha512sum -c -
          rm -rf /tmp/godot
          mkdir -p /tmp/godot
          unzip -oq /tmp/godot.zip -d /tmp/godot
          GODOT_DIR=$(find /tmp/godot -maxdepth 1 -type d -name 'Godot_v4.7.2-stable_mono_linux_x86_64' -print -quit)
          test -n "$GODOT_DIR"
          test -d "$GODOT_DIR/GodotSharp/Api/Debug"
          GODOT_BIN=$(find "$GODOT_DIR" -maxdepth 1 -type f -name 'Godot_v4.7.2-stable_mono_linux*' -print -quit)
          test -n "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Start bridge
        run: |
          nohup env GODOT_BIN="$GODOT_BIN" GODOT_WORKSPACE_ROOT=$GITHUB_WORKSPACE python3 godot/public_bridge.py >/tmp/godot.log 2>&1 &
          READY=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9765/health >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" -eq 1
          curl -fsS http://127.0.0.1:9765/selftest

      - name: Install cloudflared
        run: |
          curl -fL --retry 8 -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          echo "77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2  /tmp/cloudflared" | sha256sum -c -
          chmod +x /tmp/cloudflared

      - name: Tunnel
        id: tunnel
        run: |
          nohup /tmp/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:9765 >/tmp/cloudflared.log 2>&1 &
          URL=""
          READY=0
          for i in $(seq 1 45); do
            URL=$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' /tmp/cloudflared.log | head -1 || true)
            if test -n "$URL" && curl -fsS "$URL/health" >/dev/null 2>&1; then
              READY=1
              break
            fi
            sleep 2
          done
          test "$READY" -eq 1
          curl -fsS "$URL/health"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Publish bridge URL
        env:
          URL: ${{ steps.tunnel.outputs.url }}
        run: |
          jq -n --arg url "$URL" '{status:"ok",engine:"Godot",url:$url,runtime:"Godot 4.7.2-stable .NET Linux x86_64",source:"https://github.com/godotengine/godot"}' > runtime/godot-bridge.json
          git add runtime/godot-bridge.json
          git commit -m "chore: publish live Godot bridge [skip ci]" || true
          git push

      - name: Keep online
        env:
          MINUTES: ${{ inputs.duration_minutes }}
        run: sleep $((MINUTES*60))

      - name: Clear bridge
        if: always()
        run: |
          jq -n '{status:"not_configured",engine:"Godot",url:"",runtime:"Godot 4.7.2-stable .NET"}' > runtime/godot-bridge.json
          git add runtime/godot-bridge.json
          git commit -m "chore: clear Godot bridge [skip ci]" || true
          git push || true
