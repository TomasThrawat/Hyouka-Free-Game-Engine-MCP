name: Build MCP
on:
  push:
    branches: ["main"]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: python3 -m py_compile godot/public_bridge.py
      - run: test -f runtime/godot-smoke-test/project.godot
      - name: Verify repository is Godot-only
        run: |
          ! grep -RniE "O3DE|o3de|Blender|blender/" app godot runtime .devcontainer .github README.md 2>/dev/null
