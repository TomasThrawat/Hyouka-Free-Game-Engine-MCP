name: Build MCP
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "runtime/blender-bridge.json"
  pull_request:
    paths-ignore:
      - "runtime/blender-bridge.json"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
