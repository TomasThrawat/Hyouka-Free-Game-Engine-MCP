name: Godot Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure Git defaults
        run: git config --global init.defaultBranch main

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Restore Next.js build cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Validate DCC runtime scripts
        shell: bash
        run: |
          set -Eeuo pipefail
          for script in .devcontainer/*.sh; do
            bash -n "$script"
          done
          python3 - <<'PY'
          from pathlib import Path

          text = Path(".devcontainer/start-dcc.sh").read_text(encoding="utf-8")
          forbidden = (
              "proxy_set_header Host $host;",
              "proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;",
          )
          required = (
              r"proxy_set_header Host \$host;",
              r"proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;",
          )
          for value in forbidden:
              if value in text:
                  raise SystemExit(f"Unescaped nginx shell variable found: {value}")
          for value in required:
              if value not in text:
                  raise SystemExit(f"Expected escaped nginx variable missing: {value}")
          print("DCC shell syntax and nginx heredoc escaping passed.")
          PY

      - name: Run Godot CI
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bash .github/ci/godot-build.sh
