name: Blender Runtime Supervisor

on:
  schedule:
    - cron: "3-59/5 * * * *"
  workflow_dispatch:

concurrency:
  group: blender-runtime-supervisor
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check and renew Blender runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs_json="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/actions/workflows/blender-runtime.yml/runs" -f status=in_progress -f per_page=100)"
          count="$(jq '.workflow_runs | length' <<<"$runs_json")"
          echo "Active Blender runtime runs: $count"

          if (( count == 0 )); then
            echo "No active Blender runtime found. Starting a new runtime."
            gh workflow run blender-runtime.yml --ref main
            exit 0
          fi

          if (( count != 1 )); then
            echo "Multiple Blender runtimes are active. No additional runtime will be started."
            exit 0
          fi

          created_at="$(jq -r '.workflow_runs | sort_by(.created_at) | .[0].created_at' <<<"$runs_json")"
          created_epoch="$(date -d "$created_at" +%s)"
          now_epoch="$(date -u +%s)"
          age_seconds=$((now_epoch - created_epoch))
          echo "Active runtime age: ${age_seconds}s"

          if (( age_seconds >= 18000 )); then
            echo "Runtime is approaching its 350-minute job limit. Starting a replacement."
            gh workflow run blender-runtime.yml --ref main
          else
            echo "Current runtime is within its renewal window. No replacement needed."
          fi
