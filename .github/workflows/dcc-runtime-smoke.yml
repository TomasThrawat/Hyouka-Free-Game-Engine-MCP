name: DCC Runtime Smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-24.04
    env:
      CAPABILITIES_URL: https://hyouka-free-game-engine-mcp.vercel.app/api/capabilities
    steps:
      - name: Probe live gateway capabilities
        shell: bash
        run: |
          set -Eeuo pipefail
          curl -fsS --retry 5 --retry-delay 2 --connect-timeout 10 --max-time 45             "$CAPABILITIES_URL" > /tmp/capabilities.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/capabilities.json").read_text())
          providers = {
              item.get("id"): item
              for item in data.get("remoteProviders", [])
          }

          for provider_id in ("blender-dcc", "krita"):
              item = providers.get(provider_id, {})
              print(
                  provider_id,
                  "configured=", item.get("configured"),
                  "authConfigured=", item.get("authConfigured"),
                  "connected=", item.get("connected"),
                  "toolCount=", item.get("toolCount"),
                  "error=", item.get("error"),
              )

          failures = []
          for provider_id in ("blender-dcc", "krita"):
              item = providers.get(provider_id)
              if not item:
                  failures.append(f"{provider_id}: provider missing")
                  continue
              if not item.get("configured"):
                  failures.append(f"{provider_id}: not configured")
              if not item.get("authConfigured"):
                  failures.append(f"{provider_id}: auth not configured")
              if not item.get("connected"):
                  failures.append(
                      f"{provider_id}: disconnected ({item.get('error') or 'no error reported'})"
                  )
              if (item.get("toolCount") or 0) <= 0:
                  failures.append(f"{provider_id}: toolCount={item.get('toolCount')}")
          if failures:
              raise SystemExit("DCC runtime smoke failed: " + "; ".join(failures))

          print("connectedToolCount=", data.get("connectedToolCount"))
          print("DCC runtime smoke passed")
          PY

# Force a Git-integrated production redeploy after the DCC credential rotation.
