name: Fix DCC Codespaces Port Visibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expose-dcc-ports:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CODESPACE_NAME: hyouka-dcc-mcp-runtime-fixed-pj9w45pq474gh7g5w
    steps:
      - name: Inspect Codespace ports
        run: |
          set -euo pipefail
          gh codespace ports -c "$CODESPACE_NAME" --json sourcePort,visibility,browseUrl
      - name: Set DCC ports public
        run: |
          set -euo pipefail
          gh codespace ports visibility 9765:public 9797:public -c "$CODESPACE_NAME"
      - name: Verify DCC ports
        run: |
          set -euo pipefail
          gh codespace ports -c "$CODESPACE_NAME" --json sourcePort,visibility,browseUrl
